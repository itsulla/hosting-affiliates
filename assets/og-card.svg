<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">DeployApp.guide — Ship the app. Skip the guesswork.</title>
  <desc id="desc">A practical deployment field guide for AI-built apps.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#263129" stroke-width="1" opacity="0.62"/>
    </pattern>
    <radialGradient id="glow" cx="75%" cy="15%" r="72%">
      <stop offset="0" stop-color="#50E3A4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#111311" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#111311"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(64 54)">
    <rect width="50" height="50" rx="13" fill="#F3F4EF"/>
    <path d="M15 17l9 8-9 8" fill="none" stroke="#08724D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M29 34h9" fill="none" stroke="#111311" stroke-width="4" stroke-linecap="round"/>
    <text x="66" y="35" fill="#F3F4EF" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="-1">deployapp<tspan fill="#879088" font-weight="400">.guide</tspan></text>
  </g>

  <g transform="translate(64 175)" font-family="Arial, Helvetica, sans-serif">
    <circle cx="5" cy="-9" r="5" fill="#50E3A4"/>
    <text x="20" y="-4" fill="#B7C1B8" font-family="monospace" font-size="13" letter-spacing="2">PRACTICAL DEPLOYMENT FIELD GUIDE</text>
    <text x="0" y="91" fill="#F8F8F4" font-size="84" font-weight="800" letter-spacing="-4.5">Ship the app.</text>
    <text x="0" y="178" fill="#50E3A4" font-size="72" font-weight="800" letter-spacing="-4">Skip the guesswork.</text>
    <text x="4" y="230" fill="#B4BDB5" font-size="24" letter-spacing="-0.4">Match your AI builder’s output to the right hosting path.</text>
  </g>

  <g transform="translate(780 116) rotate(2 194 206)" filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect width="388" height="412" rx="25" fill="#F3F4EF"/>
    <text x="32" y="46" fill="#08724D" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1.6">DEPLOYMENT BRIEF / 01</text>
    <text x="32" y="102" fill="#111311" font-size="31" font-weight="800" letter-spacing="-1.2">A useful answer starts</text>
    <text x="32" y="138" fill="#111311" font-size="31" font-weight="800" letter-spacing="-1.2">with your output.</text>
    <line x1="32" y1="174" x2="356" y2="174" stroke="#C6CBC3"/>

    <text x="32" y="217" fill="#08724D" font-family="monospace" font-size="12">01</text>
    <text x="74" y="217" fill="#111311" font-size="17" font-weight="700">Identify the output</text>
    <text x="264" y="217" fill="#7B847C" font-family="monospace" font-size="10">NEXT · VITE</text>
    <line x1="32" y1="242" x2="356" y2="242" stroke="#D7DAD4"/>

    <text x="32" y="282" fill="#08724D" font-family="monospace" font-size="12">02</text>
    <text x="74" y="282" fill="#111311" font-size="17" font-weight="700">Check constraints</text>
    <text x="264" y="282" fill="#7B847C" font-family="monospace" font-size="10">DB · AUTH</text>
    <line x1="32" y1="307" x2="356" y2="307" stroke="#D7DAD4"/>

    <rect x="32" y="335" width="324" height="50" rx="11" fill="#111311"/>
    <text x="194" y="367" text-anchor="middle" fill="#F3F4EF" font-size="15" font-weight="700">Open the field guide ↗</text>
  </g>

  <g transform="translate(64 579)" font-family="monospace" font-size="12" fill="#879088" letter-spacing="0.5">
    <text x="0" y="0">/ 10 AI BUILDERS</text>
    <text x="170" y="0">/ 8 HOSTING PLATFORMS</text>
    <text x="405" y="0">/ 15 LAUNCH BLOCKERS</text>
  </g>
</svg>
